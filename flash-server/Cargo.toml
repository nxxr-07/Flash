[package]
name = "flash-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.101"
flash-common = { version = "0.1.0", path = "../flash-common" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["codec", "rt"] }
tracing = { workspace = true }
