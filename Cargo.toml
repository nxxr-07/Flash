[workspace]
members = [
    "flash-server",
    "flash-client",
    "flash-common",
]
resolver = "2"

[workspace.dependencies]
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
opentelemetry = { version = "0.33.1", features = ["logs"] }
opentelemetry-appender-tracing = { version = "0.33.1", features = ["experimental_span_attributes"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["http-proto", "logs", "reqwest-blocking-client", "reqwest-rustls"] }
opentelemetry_sdk = { version = "0.33.1", features = ["logs"] }
dotenvy = "0.15.7"
